mcs.metadata:
  componentName: Create Pending Delivery Ledger
  description: Uploads a file to a SharePoint site. Make sure to pick an existing library.
kind: ConnectorTool
authMode: Invoker
connectionReference: crf98_bajajnewsummarygenerator_XYGjw1.cr.shared_sharepointonline
connectorId: /providers/Microsoft.PowerApps/apis/shared_sharepointonline
operationId: CreateFile
toolInputs:
  - name: dataset
    value:
      kind: ValueReference
      type: "{\"type\":\"string\"}"
      defaultValue: "\"https://m365cpi17930677.sharepoint.com\""

  - name: folderPath
    value:
      kind: ValueReference
      type: "{\"type\":\"string\"}"
      defaultValue: "\"/Shared Documents/BFL Web Search/Delivery Ledger\""

  - name: name
    description: Create the filename as <runId>_delivery.json using the supplied runId unchanged.

  - name: body
    description: |-
      Create a raw JSON object for the current run with:
      runId, status set to pending, the generated newsletter subject, sentMessageId as an empty string, and createdAtUtc and updatedAtUtc set to the current UTC time. Do not include Markdown.