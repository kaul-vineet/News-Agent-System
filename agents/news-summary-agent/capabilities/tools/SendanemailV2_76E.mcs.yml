mcs.metadata:
  componentName: Send News Summary Email
  description: This operation sends an email message.
kind: ConnectorTool
authMode: Invoker
connectionReference: crf98_bajajnewsummarygenerator_XYGjw1.cr.shared_office365
connectorId: /providers/Microsoft.PowerApps/apis/shared_office365
operationId: SendEmailV2
toolInputs:
  - name: emailMessage.To
    value:
      kind: ContextVariableReference
      name: SendNewsSummaryEmail.emailMessage.To

  - name: emailMessage.Subject
    description: "Use only the nonempty validated newsletter subject produced by the successfully completed bfsi-news-summary skill."

  - name: emailMessage.Body
    description: |
      Use only the complete validated Outlook-safe HTML newsletter body produced by the successfully completed bfsi-news-summary skill. Do not call this tool when any skill validation is false. Send as HTML without Markdown or code fences.
