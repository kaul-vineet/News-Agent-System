mcs.metadata:
  componentName: Read Delivery Ledger
  description: Gets file contents using the file path.
kind: ConnectorTool
authMode: Invoker
connectionReference: crf98_bajajnewsummarygenerator_XYGjw1.cr.shared_sharepointonline
connectorId: /providers/Microsoft.PowerApps/apis/shared_sharepointonline
operationId: GetFileContentByPath
toolInputs:
  - name: dataset
    value:
      kind: ValueReference
      type: "{\"type\":\"string\"}"
      defaultValue: "\"https://m365cpi17930677.sharepoint.com\""

  - name: path
    description: |-
      Build the delivery-ledger path from runId:
       /Shared Documents/BFL Web Search/Delivery Ledger/<runId>_delivery.json
       Replace <runId> with the supplied runId unchanged. A file-not-found result means no ledger entry exists yet.