mcs.metadata:
  componentName: Get Consolidated Results
  description: Gets file contents using the file path.
kind: ConnectorTool
authMode: Invoker
connectionReference: crf98_bajajnewsummarygenerator_XYGjw1.cr.shared_sharepointonline
connectorId: /providers/Microsoft.PowerApps/apis/shared_sharepointonline
operationId: GetFileContentByPath
toolInputs:
  - name: dataset
    value:
      kind: ValueReference
      type: "{\"type\":\"string\"}"
      defaultValue: "\"https://m365cpi17930677.sharepoint.com\""

  - name: path
    description: |-
      Accept only a workflow-supplied runId that already matches
      ^[A-Za-z0-9_-]{1,100}$. Reject and do not call this tool for any other
      value, including values containing whitespace, dots, slashes, backslashes,
      colons, percent signs, query markers, or fragments.
      Build only this exact path:
       /Shared Documents/BFL Web Search/Outbound/<runId>_consolidated.json
      Replace <runId> with the validated value unchanged. Never accept or
      construct any other path.